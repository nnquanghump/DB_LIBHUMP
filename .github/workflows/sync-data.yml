name: Dong bo Dashboard
on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: dashboard-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kiem tra bo xu ly
        run: node --test scripts/*.test.mjs
      - name: Tai va xu ly Google Sheets
        id: sync
        run: node scripts/sync-data.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Xuat ban ket qua hoac trang bao loi
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Danh dau loi dong bo sau khi da xuat ban trang bao loi
        if: steps.sync.outputs.ok != 'true'
        run: |
          echo 'Khong dong bo duoc Sheets. Da xuat ban trang bao loi, khong dung so lieu cu.'
          exit 1
